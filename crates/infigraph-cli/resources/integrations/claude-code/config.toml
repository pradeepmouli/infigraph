label = "Claude Code"

[[artifact]]
path = ".claude/CLAUDE.md"
strategy = "marker_delimited"
start = "<!-- infigraph-primary-search -->"
end = "<!-- /infigraph-primary-search -->"
# A CLAUDE.md is the user's own file: update the block in one that exists,
# never create one.
create_if_missing = false
content_file = "../shared/agents.md"

[[artifact]]
path = ".claude/skills/infigraph-reindex/SKILL.md"
strategy = "overwrite"
content_file = "../shared/skills/infigraph-reindex/SKILL.md"

[[artifact]]
path = ".claude/skills/infigraph-tool-routing/SKILL.md"
strategy = "overwrite"
content_file = ["../shared/skills/infigraph-tool-routing/SKILL.md", "../shared/tool-routing.md", "../shared/conventions.md"]

[[artifact]]
path = ".claude/skills/infigraph-tool-routing/references/tools.md"
strategy = "overwrite"
content_file = "../shared/skills/infigraph-tool-routing/references/tools.md"
