[package]
name = "infigraph-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ast", "code-analysis", "graph-database", "tree-sitter", "code-intelligence"]
categories = ["development-tools", "parser-implementations"]
readme.workspace = true
description = "AST-powered code analysis framework — parser, graph, diff, and analysis engine"

[dependencies]
tree-sitter.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# lbug is a maintained fork of Kuzu (columnar embedded graph DB), published to crates.io.
# Aliased as `kuzu` to match the upstream Kuzu API surface used throughout the codebase.
kuzu = { package = "lbug", version = "= 0.16.0" }
cozo = { version = "0.7.6", features = ["storage-sqlite"] }
rayon = "1"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
glob = "0.3"
regex = "1"
dirs-next = "2"
model2vec-rs = { version = "0.1", default-features = false, features = ["onig"] }
scip = "0.7.1"
protobuf = "3"
tempfile = "3"
# macos_kqueue enables the kqueue backend on macOS; notify selects inotify on Linux automatically.
notify = "6"
ureq = "2"
usearch = "2.18"
parquet = "58.3"
arrow = { version = "58.3", features = ["prettyprint"] }
ignore = "0.4"
serde_yaml = "0.9.34"
fs2 = "0.4.3"
memmap2 = "0.9"
sysinfo = "0.39.6"
# Unconditional (not just under `remote`): the daemon watch loop runs each
# index drain on a `spawn_blocking` task so a long drain can't stall the
# loop. The `neo4j`/`postgres` features used to pull this in optionally and
# now share this one entry -- `rt-multi-thread` is the only feature either
# of them ever asked for.
# Features expanded for daemon/watch command split: time, process for
# CancellationToken; macros for the `tokio::select!` in watch::producer;
# sync for its `tokio::sync::mpsc` fsevent bridge. `sync` is declared
# explicitly rather than relied on via feature unification with tokio-util's
# own request -- an implicit feature here already broke one build once.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "process", "macros", "sync"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
neo4j = ["neo4rs"]
postgres = ["tokio-postgres", "pgvector"]
remote = ["neo4j", "postgres"]

[dependencies.neo4rs]
version = "0.8"
optional = true

[dependencies.tokio-postgres]
version = "0.7"
optional = true

[dependencies.pgvector]
version = "0.4"
features = ["postgres"]
optional = true

[dev-dependencies]
tree-sitter-python = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-dart = "0.2"
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
# Dev-dep cycle (infigraph-languages -> infigraph-core) is fine: dev-deps are excluded
# from the normal build graph. Needed so remote_cross_service.rs can index real
# TypeScript/Rust fixtures with the same bundled_registry() the CLI passes as
# `build_registry` to index_group/link_cross_service_calls in production.
infigraph-languages = { path = "../infigraph-languages" }
