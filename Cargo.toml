[workspace]
members = [
    "crates/infigraph-core",
    "crates/infigraph-languages",
    "crates/infigraph-docs",
    "crates/infigraph-confluence",

    "crates/infigraph-grammar-plugin",
    "crates/infigraph-pipeline-plugin",
    "crates/infigraph-cli",
    "crates/infigraph-mcp",
    "crates/lsp-to-scip",
    "crates/tree-sitter-vb6",
]
resolver = "2"

[workspace.package]
version = "3.2.16"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/intuit/infigraph"
homepage = "https://intuit.github.io/infigraph/"
documentation = "https://intuit.github.io/infigraph/"
keywords = ["code-intelligence", "graph", "mcp", "ast", "search"]
categories = ["development-tools"]
readme = "README.md"

[workspace.dependencies]
infigraph-core = { path = "crates/infigraph-core" }
infigraph-languages = { path = "crates/infigraph-languages" }
tree-sitter = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
# The one place the graph engine's version is written. lbug is a maintained fork of Kuzu
# (columnar embedded graph DB) published to crates.io, aliased `kuzu` to match the upstream
# API surface used throughout. Every crate says `kuzu = { workspace = true }`, and
# `[env] LBUG_VERSION` in .cargo/config.toml must name the same release, because lbug's
# build script otherwise fetches whatever its prebuilt source calls "latest" and caches it
# once (crates/infigraph-core/tests/lbug_pin.rs holds all three together).
kuzu = { package = "lbug", version = "= 0.20.4" }

# lbug (Kuzu graph DB) produces a static library that exceeds the 4 GB PE32
# limit on Windows when compiled in debug mode (LNK1248).
[profile.dev.package.lbug]
opt-level = 2

# esaxx-rs hardcodes static_crt(true) (/MT) which conflicts with lbug's /MD
# (dynamic CRT) on Windows MSVC, causing LNK2038 linker errors.
[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }

# notify 6.1.1 plus FSEventStreamSetExclusionPaths (macOS), so fseventsd stops delivering events
# from subtrees the watcher would discard anyway. See patches/notify-6.1.1-exclusions/README.infigraph.md.
notify = { path = "patches/notify-6.1.1-exclusions" }
