# Every process cargo runs -- test binaries and the CLI/daemon children they
# spawn, the pre-commit hook, CI -- keeps its project registry, registry lock
# and instance files in the checkout instead of the developer's real
# ~/.infigraph. A test that saved an in-memory `Registry` (index_group ends in
# `registry.save()`) overwrote the real registry with its fixtures and
# deregistered every project on the machine; a per-test guard existed but only
# covered one module. This redirects only the account's *real* home
# (`instances::infigraph_home`): a test that points HOME or
# INFIGRAPH_REGISTRY_HOME at a tempdir keeps its own isolation. `cargo run`
# here gets the scratch registry too: use the installed binary for real work.
[env]
INFIGRAPH_REGISTRY_REAL_HOME_REDIRECT = { value = "target/test-registry-home", relative = true }

# usearch and lbug both vendor simsimd, causing duplicate symbol errors on Linux
# where the linker treats them as hard errors. Allow multiple definitions so the
# linker picks the first and discards duplicates (matches macOS/Windows behavior).
# Uses -Wl, prefix since cc is the linker driver (forwards to ld/lld via -fuse-ld).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]

# Windows default main-thread stack is 1MB; tree-sitter/ANTLR parsers
# recurse deeply during static init and Cli::parse(). Set 32MB default.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:33554432"]
