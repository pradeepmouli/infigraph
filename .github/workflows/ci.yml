name: CI

on:
  push:
    branches: [main, feat/hardening]
  pull_request:
    branches: [main, feat/hardening]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The ubuntu runner runs out of disk linking this workspace's test binaries
  # -- upstream sees `ld terminated with signal 7 [Bus error]` and outright
  # "No space left on device" on several PRs, even with the free-disk step
  # below. Debug info dominates target/debug and CI never reads the symbols.
  # Try `line-tables-only` instead once a run has proved to fit; that keeps
  # line numbers in panics at a fraction of full DWARF.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Pin the backend for every test process rather than relying on the
  # variable being absent (#159). Tests build throwaway projects in
  # tempdirs, where a routed read would mean auto-starting a daemon per
  # project; local is what they want. Once local stops being the default,
  # "absent" stops meaning local -- so say it.
  INFIGRAPH_BACKEND: kuzu

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform independently. With fail-fast on, the first
      # platform to fail cancels the others, so a run tells you about one
      # platform at a time -- which turned a batch of cross-platform defects
      # into one CI cycle each.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # --keep-going: the lint pass stops at the first target that fails,
      # the same one-defect-per-cycle trap `--no-fail-fast` fixes for Test
      # below. On Windows, the only place this job's lint is not also
      # checked locally, three consecutive runs each surfaced one new
      # unix-only-code warning that the previous failure had hidden.
      - name: Clippy
        run: cargo clippy --all-targets --keep-going -- -D warnings
      # Windows runs Clippy but not the tests: lbug's build script emits
      # `cargo:rustc-link-lib=ssl`/`=crypto`, so every test binary needs
      # OpenSSL to link, and windows-latest puts no libssl.lib on MSVC's
      # path (LNK1181). Release builds are unaffected and Windows assets
      # still ship -- the release job builds only the two binary crates, in
      # release, and links fine. Compiling Windows is still worth doing: 7 of
      # the 14 defects found when this fork's CI was first switched on were
      # Windows compile failures, none of them reachable from macOS.
      # Tracked in pradeepmouli/infigraph#147.
      # --no-fail-fast for the same reason `fail-fast: false` is set on the
      # matrix above, one level down: `cargo test` stops after the first
      # failing test *target*, so a run reports one failing suite per
      # platform and every fix silently promotes the next never-executed
      # suite into view. Three consecutive runs each surfaced exactly one
      # new suite that had never run in this CI at all
      # (daemon_kuzu_e2e -> daemon_stale_build_self_check -> verify /
      # watch_daemon), turning one batch of defects into one CI cycle each.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --all --no-fail-fast

  # R8.5 (#88): a graph written by the previous release must still open with
  # this build -- the same query results, or a clean storage-version refusal,
  # never a wipe or a silent rebuild. Guards R8.1 (#140) for good. One Linux
  # runner: the open path is the same code on every platform.
  #
  # "Previous release" is the newest `v*` tag reachable from HEAD that is not
  # HEAD itself. This fork publishes no releases and carries no v3.x tags, so
  # the job fetches the upstream project's tags first (public, no auth, tags
  # only: nothing is pushed anywhere, and pushing a `v*` tag to the fork would
  # start release.yml). The fetch and the ancestry check fail the job loudly.
  #
  # Only the tag's binary is cached, keyed on the tag's commit, so a tag is
  # built once -- about 30 minutes on a runner -- and every later run restores
  # it in seconds. Caches are readable only from the branch that saved them,
  # its base and the default branch, so the first run on each new branch pays
  # the build again. The newest tag only: while its lbug matches HEAD's (or
  # HEAD's reads and upgrades its storage version in place, as 0.16 -> 0.20
  # does) a second tag adds nothing. The day a tag's lbug cannot be read by
  # HEAD's, the same test starts exercising the refusal branch of its checker
  # with no change here.
  upgrade:
    name: Upgrade smoke test
    runs-on: ubuntu-latest
    # A cold build of the previous tag is ~30 minutes; this stops a hung
    # binary from sitting for the 6 hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and the history `git tag --merged` walks
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Find the previous release
        id: prev
        run: |
          set -euo pipefail
          # Tags only (--no-tags: nothing else rides along); a failed fetch
          # fails the job rather than quietly leaving only the fork's tags.
          git fetch --no-tags https://github.com/intuit/infigraph.git 'refs/tags/v*:refs/tags/v*'
          head_sha=$(git rev-parse HEAD)
          for tag in $(git tag --merged HEAD --sort=-v:refname --list 'v*'); do
            sha=$(git rev-parse "$tag^{commit}")
            if [ "$sha" != "$head_sha" ]; then
              git merge-base --is-ancestor "$sha" HEAD
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "previous release: $tag ($sha)"
              exit 0
            fi
          done
          echo "::error::no v* tag is an ancestor of HEAD, so there is no previous release to upgrade from"
          exit 1
      - name: Restore the previous release's binary
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: old-bin/infigraph
          key: infigraph-${{ steps.prev.outputs.sha }}-${{ runner.os }}-${{ runner.arch }}
      # A failed build fails the job: the test below must never be reached
      # without the binary, and must never be skipped for want of one.
      - name: Build the previous release
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git worktree add --detach ../previous "${{ steps.prev.outputs.sha }}"
          cargo build --release -p infigraph-cli --manifest-path ../previous/Cargo.toml \
            --target-dir ../previous-target
          mkdir -p old-bin
          cp ../previous-target/release/infigraph old-bin/infigraph
      - name: Save the previous release's binary
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: old-bin/infigraph
          key: infigraph-${{ steps.prev.outputs.sha }}-${{ runner.os }}-${{ runner.arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-upgrade
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # INFIGRAPH_REQUIRE_UPGRADE_TEST makes a missing binary a failure rather
      # than a skip, and the marker the test prints only after all three
      # passes judged clean proves it ran: a filtered-out or skipped test
      # prints nothing and fails the grep.
      - name: Open the previous release's graph with this build
        env:
          OLD_INFIGRAPH_BIN: ${{ github.workspace }}/old-bin/infigraph
          INFIGRAPH_REQUIRE_UPGRADE_TEST: "1"
        run: |
          set -o pipefail
          "$OLD_INFIGRAPH_BIN" --version
          cargo test -p infigraph-cli --test upgrade_smoke -- --nocapture --test-threads=1 \
            2>&1 | tee upgrade.log
          grep -q 'UPGRADE_SMOKE_RAN passes=3' upgrade.log
          grep -E 'UPGRADE_SMOKE_RAN pass=' upgrade.log
