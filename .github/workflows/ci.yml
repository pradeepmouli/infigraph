name: CI

on:
  push:
    branches: [main, feat/hardening]
  pull_request:
    branches: [main, feat/hardening]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The ubuntu runner runs out of disk linking this workspace's test binaries
  # -- upstream sees `ld terminated with signal 7 [Bus error]` and outright
  # "No space left on device" on several PRs, even with the free-disk step
  # below. Debug info dominates target/debug and CI never reads the symbols.
  # Try `line-tables-only` instead once a run has proved to fit; that keeps
  # line numbers in panics at a fraction of full DWARF.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform independently. With fail-fast on, the first
      # platform to fail cancels the others, so a run tells you about one
      # platform at a time -- which turned a batch of cross-platform defects
      # into one CI cycle each.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Windows runs Clippy but not the tests: lbug's build script emits
      # `cargo:rustc-link-lib=ssl`/`=crypto`, so every test binary needs
      # OpenSSL to link, and windows-latest puts no libssl.lib on MSVC's
      # path (LNK1181). Release builds are unaffected and Windows assets
      # still ship -- the release job builds only the two binary crates, in
      # release, and links fine. Compiling Windows is still worth doing: 7 of
      # the 14 defects found when this fork's CI was first switched on were
      # Windows compile failures, none of them reachable from macOS.
      # Tracked in pradeepmouli/infigraph#147.
      # --no-fail-fast for the same reason `fail-fast: false` is set on the
      # matrix above, one level down: `cargo test` stops after the first
      # failing test *target*, so a run reports one failing suite per
      # platform and every fix silently promotes the next never-executed
      # suite into view. Three consecutive runs each surfaced exactly one
      # new suite that had never run in this CI at all
      # (daemon_kuzu_e2e -> daemon_stale_build_self_check -> verify /
      # watch_daemon), turning one batch of defects into one CI cycle each.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --all --no-fail-fast
